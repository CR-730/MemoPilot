[project]
name = "memopilot-agent"
version = "0.1.0"
description = "一个具备主动唤醒、分层记忆与工具执行能力的个人 AI Agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "apscheduler>=3.11,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4,<5",
  "lark-oapi>=1.4,<2",
  "mcp>=1.20,<2",
  "openai>=2,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "redis>=6,<9",
  "sqlite-vec>=0.1.6,<0.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
memopilot = "memopilot.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "types-jsonschema>=4,<5",
  "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memopilot"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["memopilot"]
