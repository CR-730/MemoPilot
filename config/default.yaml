# 非敏感运行默认值。Secret 只通过环境变量或 Docker Secret 注入。
workspace: workspace

chat_base_url: https://api.deepseek.com
chat_model: deepseek-v4-flash
redis_url: redis://localhost:6379/0

proactive_enabled: false
proactive_tick_seconds: 300
drift_enabled: true
drift_min_interval_hours: 3
lease_ttl_seconds: 30
lease_heartbeat_seconds: 10
reclaim_idle_seconds: 60
sqlite_busy_timeout_seconds: 5
mcp_startup_timeout_seconds: 15
mcp_call_timeout_seconds: 30
llm_retry_limit: 2
llm_max_iterations: 10
llm_max_output_tokens: 2048
llm_timeout_seconds: 60
llm_thinking_enabled: false
tool_search_enabled: true
memory_score_threshold: 0.45
memory_score_thresholds:
  procedure: 0.58
  preference: 0.52
  event: 0.45
  profile: 0.50
memory_embed_timeout_seconds: 5
memory_procedure_guard_enabled: true
memory_inject_max_forced: 3
memory_inject_max_procedure_preference: 4
memory_inject_max_event_profile: 2
memory_hotness_alpha: 0.2
memory_hotness_half_life_days: 14
memory_optimizer_enabled: true
memory_optimizer_interval_seconds: 64800
display_timezone: Asia/Shanghai
